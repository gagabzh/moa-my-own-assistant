version: '3.8'

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:8.0.1
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"  # HTTP interface (3001 to avoid conflict with bookstack)
      - "127.0.0.1:2223:22"     # SSH port (mapped to 2223 to avoid conflict)
    volumes:
      - forgejo_data:/var/lib/gitea
      - forgejo_config:/etc/gitea
      - forgejo_ssh:/home/git/.ssh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - GITEA_WORK_DIR=/var/lib/gitea
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__SSH_PORT=22
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    networks:
      - forgejo_network
    labels:
      - "traefik.enable=false"

volumes:
  forgejo_data:
    driver: local
  forgejo_config:
    driver: local
  forgejo_ssh:
    driver: local

networks:
  forgejo_network:
    driver: bridge
