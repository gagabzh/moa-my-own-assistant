# Configuration Vikunja (optionnelle)
# Ce fichier peut être monté dans le conteneur via docker-compose
# Vikunja utilise principalement des variables d'environnement

# Configuration de la base de données
# database:
#   type: postgres
#   host: vikunja-db
#   port: 5432
#   user: vikunja
#   password: ${VIKUNJA_DB_PASSWORD}
#   database: vikunja
#   sslmode: disable

# Configuration du serveur
# service:
#   interface: 0.0.0.0
#   port: 3456
#   jwtsecret: ${VIKUNJA_JWT_SECRET}
#   frontend:
#     enabled: true
#   openregistration: ${VIKUNJA_ENABLE_OPEN_REGISTRATION}

# Configuration des tâches
# tasks:
#   defaultprojectid: 1
#   defaultlistid: 1

# Configuration des fichiers
# files:
#   enabled: true
#   basepath: /app/vikunja/files
#   maxsize: 10485760 # 10MB
